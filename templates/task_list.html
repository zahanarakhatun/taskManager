{% extends 'master/base.html' %}
<!DOCTYPE html>
<html>
<head><title>Task Manager</title></head>
<body>
    <h2>Task List</h2>
    <a href="{% url 'create_task' %}">+ Add New Task</a>
    <ul>
        {% for task in tasks %}
            <li>
                {% if task.completed %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}
                | <a href="{% url 'update_task' task.pk %}">Edit</a>
                | <a href="{% url 'delete_task' task.pk %}">Delete</a>
            </li>
        {% empty %}
            <li>No tasks available.</li>
        {% endfor %}
    </ul>
</body>
</html>
